<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مسابقة المعلومات</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap">
<style>
:root{--bg:#eef2f7;--surface:#fff;--ink:#14213d;--muted:#5b6785;--line:#d5dce8;--accent:#2a5bd7;--accent-ink:#fff;--ok:#1b8a5a;--ok-bg:#dff5ea;--bad:#c63d3d;--bad-bg:#fbe3e3;--gold:#f2b134;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1626;--surface:#19223a;--ink:#eaf0ff;--muted:#9aa7c7;--line:#2c3856;--accent:#6f98ff;--accent-ink:#0f1626;--ok:#58d49a;--ok-bg:#12382b;--bad:#ff8585;--bad-bg:#431c22;--gold:#f2b134}}
:root[data-theme="dark"]{--bg:#0f1626;--surface:#19223a;--ink:#eaf0ff;--muted:#9aa7c7;--line:#2c3856;--accent:#6f98ff;--accent-ink:#0f1626;--ok:#58d49a;--ok-bg:#12382b;--bad:#ff8585;--bad-bg:#431c22}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Tajawal","Segoe UI",Tahoma,sans-serif;line-height:1.6;display:flex;justify-content:center}
main{width:100%;max-width:560px;padding:20px 16px 32px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px 20px}
h1{font-size:2.4rem;font-weight:900;margin:0 0 8px;line-height:1.2}
p{margin:0 0 16px;color:var(--muted)}
button{font:inherit;cursor:pointer}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:12px 28px;font-weight:700;font-size:1.1rem}
.btn:focus-visible,.opt:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-bottom:10px}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin-bottom:20px}
.bar i{display:block;height:100%;width:100%;background:var(--accent);transform-origin:right;transition:transform 1s linear}
.bar i.low{background:var(--bad)}
.q{font-size:1.45rem;font-weight:700;margin:0 0 18px;line-height:1.5}
.opts{display:grid;gap:10px}
.opt{text-align:right;background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:14px 16px;font-size:1.1rem;font-weight:500;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ink);font-weight:700}
.opt.bad{background:var(--bad-bg);border-color:var(--bad)}
.opt:disabled{cursor:default}
.fb{min-height:28px;margin:14px 0 0;font-weight:700}
.next{margin-top:8px;display:none}
.score{font-size:4rem;font-weight:900;line-height:1;margin:8px 0}
.hide{display:none}
header.site{background:var(--surface);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;justify-content:center}
.bar2{width:100%;max-width:720px;display:flex;justify-content:space-between;align-items:center}
.brand{font-weight:900;font-size:1.2rem}
.link{background:none;border:0;color:var(--accent);font-weight:700;font-size:1rem;padding:6px 4px}
.link:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
footer{text-align:center;color:var(--muted);font-size:.9rem;padding:16px 16px 28px}
.hero{padding:8px 0 20px}
.hero h1{font-size:2.6rem}
.grid{display:grid;gap:12px}
.lesson{text-align:right;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.lesson:hover{border-color:var(--accent)}
.lesson:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.lesson b{font-size:1.15rem;display:block}
.lesson span{color:var(--muted);font-size:.95rem}
.lesson em{font-style:normal;font-weight:700;color:var(--accent);white-space:nowrap}
.lesson.all{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.lesson.all span,.lesson.all em{color:var(--accent-ink)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.ghost{background:transparent;color:var(--accent);border:2px solid var(--accent)}
body{flex-direction:column;align-items:stretch}
main{margin:0 auto}
header.site{background:linear-gradient(90deg,#2a5bd7,#8a4fd6);border-bottom:0}
.brand,.link{color:#fff}
.link{background:rgba(255,255,255,.18);border-radius:10px;padding:6px 14px}
.hero h1{background:linear-gradient(90deg,#2a5bd7,#8a4fd6,#f08a24);-webkit-background-clip:text;background-clip:text;color:transparent}
.lesson{border-right:8px solid var(--c)}
.lesson[data-l="0"]{--c:#1aa38a}.lesson[data-l="1"]{--c:#f08a24}.lesson[data-l="2"]{--c:#8a4fd6}
.lesson[data-l="0"] em{color:#1aa38a}.lesson[data-l="1"] em{color:#f08a24}.lesson[data-l="2"] em{color:#8a4fd6}
.lesson.all{background:linear-gradient(90deg,#2a5bd7,#8a4fd6);border-color:transparent;color:#fff}
.lesson.all span,.lesson.all em{color:#fff}
.bar i{background:linear-gradient(90deg,#1aa38a,#2a5bd7)}
.bar i.low{background:var(--bad)}
.btn{background:linear-gradient(90deg,#2a5bd7,#8a4fd6);color:#fff}
.btn.ghost{background:transparent;color:var(--accent)}
.opt:nth-child(1){border-right:6px solid #2a5bd7}.opt:nth-child(2){border-right:6px solid #f08a24}
.opt:nth-child(3){border-right:6px solid #1aa38a}.opt:nth-child(4){border-right:6px solid #8a4fd6}
.score{background:linear-gradient(90deg,#f08a24,#d6336c);-webkit-background-clip:text;background-clip:text;color:transparent}
footer{font-weight:700}
.ig{display:inline-block;margin-bottom:8px;padding:8px 18px;border-radius:999px;background:linear-gradient(90deg,#f09433,#dc2743,#bc1888);color:#fff;text-decoration:none}
.ig:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<header class="site"><div class="bar2"><span class="brand">🧠 مسابقة الحاسوب</span><button class="link" id="home">الرئيسية</button></div></header>
<main>
 <section id="start" class="hero">
  <h1>اختبر معلوماتك في الحاسوب</h1>
  <p>اختر درسًا لتبدأ، أو العب بأسئلة من كل الدروس. لكل سؤال خمس عشرة ثانية، وكلما أجبت أسرع ربحت نقاطًا أكثر.</p>
  <div class="grid">
   <button class="lesson" data-l="0"><div><b>تقنية المعلومات</b><span>البيانات والمعلومات وأنظمة التشغيل</span></div><em>7 أسئلة</em></button>
   <button class="lesson" data-l="1"><div><b>تجميع الحاسوب</b><span>مكونات الحاسوب ووحدات قياس الذاكرة</span></div><em>16 سؤالًا</em></button>
   <button class="lesson" data-l="2"><div><b>نظام التشغيل</b><span>تقسيم القرص وتهيئته وتثبيت النظام</span></div><em>7 أسئلة</em></button>
   <button class="lesson all" data-l="3"><div><b>كل الدروس</b><span>10 أسئلة عشوائية من الدروس الثلاثة</span></div><em>ابدأ</em></button>
  </div>
 </section>

 <section id="game" class="card hide">
  <div class="top"><span id="num"></span><span id="pts"></span><span id="time"></span></div>
  <div class="bar"><i id="fill"></i></div>
  <h2 class="q" id="q"></h2>
  <div class="opts" id="opts"></div>
  <div class="fb" id="fb" aria-live="polite"></div>
  <button class="btn next" id="next">السؤال التالي</button>
 </section>

 <section id="end" class="card hide">
  <h1 id="msg"></h1>
  <div class="score" id="final"></div>
  <p id="detail"></p>
  <div class="row"><button class="btn" id="again">العب مرة أخرى</button><button class="btn ghost" id="back">اختيار درس آخر</button></div>
 </section>
</main>
<footer><div><a class="ig" href="https://www.instagram.com/tech_teacher59" target="_blank" rel="noopener">قم بزيارة صفحتنا على الانستغرام</a></div><div>© جميع الحقوق محفوظة للأستاذة عروة</div></footer>
<script>
var BANK=[
["البيانات هي:",["حقائق وقيم بدون معنى","معلومات جاهزة للاستعمال","برامج تشغيل الحاسوب","أجهزة ملموسة"],0],
["المعلومات هي بيانات:",["لم تُعالج بعد","تمت معالجتها فأصبحت ذات معنى","محذوفة من الحاسوب","مخزنة في ROM فقط"],1],
["ناتج المعادلة: بيانات + معالجة =",["برنامج","عتاد","معلومات","نظام تشغيل"],2],
["أي مما يلي ليس من الأبعاد الأربعة للمعلوماتية؟",["العتاد","البرمجيات","الموارد المالية","الموارد البشرية"],2],
["أي مما يلي برنامج تطبيقي؟",["Windows","Excel","Android","Unix"],1],
["أي مما يلي نظام تشغيل؟",["Word","Excel","Android","Scanner"],2],
["المعلوماتية علم يسمح بمعالجة المعلومات وتخزينها وجمعها:",["يدويًا فقط","بطريقة آلية باستعمال الحاسوب","عن طريق الهاتف فقط","دون أي جهاز"],1],
["الحاسوب جهاز إلكتروني يقوم باستقبال البيانات و:",["حذفها فقط","طباعتها فقط","تخزينها ومعالجتها","نسخها فقط"],2],
["المكونات غير المادية للحاسوب تسمى:",["العتاد","البرمجيات","الوحدة المركزية","وحدات الإدخال"],1],
["أي مما يلي وحدة إدخال؟",["الشاشة","الطابعة","مكبرات الصوت","الماسح الضوئي"],3],
["أي مما يلي وحدة إخراج؟",["لوحة المفاتيح","الطابعة","الفأرة","الميكروفون"],1],
["مهمة علبة التغذية بالكهرباء:",["معالجة البيانات","تحويل التيار الكهربائي للوحدة المركزية","تخزين الملفات","تبريد المعالج"],1],
["أكبر قطعة في الوحدة المركزية، وبها تُربط جميع وحدات الحاسوب:",["المعالج","القرص الصلب","اللوحة الأم","الذاكرة الحية"],2],
["يُعتبر عقل الحاسوب:",["المعالج","الشاشة","الطابعة","الفأرة"],0],
["تُقاس سرعة المعالج بوحدة:",["GHz","Ko","Bit","Watt"],0],
["ذاكرة RAM تُمحى محتوياتها عند:",["فتح الملفات","انقطاع التيار الكهربائي","تشغيل الشاشة","إضافة برنامج"],1],
["الذاكرة التي تحتوي على نظام الإدخال والإخراج BIOS هي:",["RAM","ROM","القرص الصلب","بطاقة الصوت"],1],
["المسؤول عن التخزين الدائم في الحاسوب:",["القرص الصلب","RAM","المعالج","اللوحة الأم"],0],
["أصغر وحدة لقياس الذاكرة:",["Octet","Ko","Bit","Mo"],2],
["1 Octet يساوي:",["2 Bits","4 Bits","8 Bits","16 Bits"],2],
["1 Ko يساوي:",["100 octet","1000 octet","1024 octet","8 octet"],2],
["1 Mo يساوي:",["1024 Ko","1000 Ko","512 Ko","1024 Go"],0],
["المساحة الكافية لتخزين حرف واحد أو رقم أو رمز هي:",["Bit","Octet","Go","To"],1],
["نظام التشغيل هو وسيط بين:",["الشاشة والطابعة","الحاسوب والمستخدم","RAM وROM","المعالج واللوحة الأم"],1],
["تقسيم القرص الصلب يعني:",["حذف محتواه","تجزئته إلى أقسام أصغر","نسخه إلى قرص آخر","تسريع المعالج"],1],
["من أنظمة الملفات المستعملة في التهيئة المنطقية:",["NTFS","BIOS","RAM","HDMI"],0],
["التهيئة الفيزيائية للقرص الصلب تتم:",["عند مصنع الأقراص الصلبة","أثناء تثبيت Windows","عند تشغيل الشاشة","عند حذف الملفات"],0],
["للدخول إلى إعدادات BIOS عند بدء التشغيل نضغط على:",["Suppr أو F2","Ctrl أو Alt","Shift أو Tab","Enter أو Space"],0],
["قبل تثبيت Windows 7 نغيّر الإقلاع الأولي في BIOS إلى:",["الشاشة","CD-ROM أو USB","الذاكرة الحية","بطاقة الشبكة"],1],
["تثبيت نظام التشغيل هو:",["نسخ ملفاته وبرامجه على القرص الصلب بشكل دائم","حذف القرص الصلب","تركيب اللوحة الأم","شراء حاسوب جديد"],0]
];

var TOTAL=10,SECS=15,qs,i,score,right,left,timer,locked;
function $(id){return document.getElementById(id)}
function shuffle(a){a=a.slice();for(var k=a.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1));var t=a[k];a[k]=a[j];a[j]=t}return a}
function show(id){["start","game","end"].forEach(function(s){$(s).classList.toggle("hide",s!==id)})}
var LES=[[0,7],[7,23],[23,30],[0,30]],cur=3;
function start(l){
  cur=l;var pool=BANK.slice(LES[l][0],LES[l][1]);TOTAL=Math.min(10,pool.length);
  qs=shuffle(pool).slice(0,TOTAL).map(function(q){
    var correct=q[1][q[2]];var o=shuffle(q[1]);return{t:q[0],o:o,a:o.indexOf(correct)}});
  i=0;score=0;right=0;show("game");load();
}
function load(){
  locked=false;var q=qs[i];
  $("num").textContent="السؤال "+(i+1)+" من "+TOTAL;
  $("pts").textContent="النقاط: "+score;
  $("q").textContent=q.t;$("fb").textContent="";$("fb").style.color="";
  $("next").style.display="none";
  var box=$("opts");box.innerHTML="";
  q.o.forEach(function(txt,k){
    var b=document.createElement("button");b.className="opt";b.textContent=txt;
    b.onclick=function(){pick(k)};box.appendChild(b)});
  left=SECS;tick(true);
  clearInterval(timer);timer=setInterval(function(){left--;tick();if(left<=0){pick(-1)}},1000);
}
function tick(reset){
  $("time").textContent=left+" ث";
  var f=$("fill");f.classList.toggle("low",left<=5);
  if(reset){f.style.transition="none";f.style.transform="scaleX(1)";void f.offsetWidth;f.style.transition=""}
  f.style.transform="scaleX("+Math.max(left-1,0)/(SECS-1)+")";
}
function pick(k){
  if(locked)return;locked=true;clearInterval(timer);
  var q=qs[i],btns=$("opts").children;
  for(var j=0;j<btns.length;j++){btns[j].disabled=true}
  btns[q.a].classList.add("ok");
  if(k===q.a){var gain=100+left*10;score+=gain;right++;
    $("fb").textContent="إجابة صحيحة، +"+gain+" نقطة";$("fb").style.color="var(--ok)"}
  else{if(k>=0)btns[k].classList.add("bad");
    $("fb").textContent=k<0?"انتهى الوقت":"إجابة خاطئة";$("fb").style.color="var(--bad)"}
  $("pts").textContent="النقاط: "+score;
  $("next").textContent=i===TOTAL-1?"عرض النتيجة":"السؤال التالي";
  $("next").style.display="inline-block";$("next").focus();
}
function finish(){
  show("end");
  $("msg").textContent=right>=9?"مذهل، أنت موسوعة!":right>=6?"أحسنت، نتيجة رائعة":right>=4?"نتيجة جيدة، حاول مجددًا":"لا بأس، المحاولة القادمة أفضل";
  $("final").textContent=score;
  $("detail").textContent="أجبت عن "+right+" من "+TOTAL+" أسئلة إجابة صحيحة.";
  $("again").focus();
}
Array.prototype.forEach.call(document.querySelectorAll(".lesson"),function(b){b.onclick=function(){start(+b.dataset.l)}});
function home(){clearInterval(timer);show("start");window.scrollTo(0,0)}
$("home").onclick=home;$("back").onclick=home;$("again").onclick=function(){start(cur)};
$("next").onclick=function(){if(i===TOTAL-1){finish()}else{i++;load()}};
</script>
</body>
</html>
